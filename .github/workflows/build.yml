# Paquets de l'application de bureau, sur chaque système (PyInstaller ne fait
# pas de compilation croisée) : .deb sous Linux, installateur NSIS et zip sous
# Windows, dmg et zip sous macOS (Apple Silicon), nommés avec la version de
# app-names.json (vérifiée). Lancé à la main (onglet Actions) ; les paquets sont
# des artefacts de l'exécution. Appelé par release.yml sur un tag vX.Y.Z (release
# GitHub), et par ci.yml sous Linux sans paquet : serveur figé et test de fumée.
name: Package

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      os:
        description: Runners, en liste JSON (par défaut les trois systèmes)
        type: string
        default: '["ubuntu-24.04", "windows-2025", "macos-26"]'
      freeze-only:
        description: Serveur figé et test de fumée seulement, sans paquet
        type: boolean
        default: false

# Runners figés (pas de *-latest), à changer quand GitHub retire une image ; la
# liste est écrite deux fois (défaut de `os` et matrice : `env` n'y est pas lisible).
#   - ubuntu-24.04 et non Ubuntu 26 : le serveur figé dépend de la glibc du
#     système de build, le .deb doit aussi marcher sur 24.04 ;
#   - windows-2025, macos-26 (Apple Silicon) : pour la reproductibilité ; le
#     système minimal dépend de Python et d'Electron, pas du runner.

permissions:
  contents: read

jobs:
  package:
    name: ${{ inputs.freeze-only && 'Serveur figé' || 'Paquet' }} ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # inputs est vide sur un tag ou à la main : les trois systèmes
        os: ${{ fromJSON(inputs.os || '["ubuntu-24.04", "windows-2025", "macos-26"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash sous Windows : mêmes commandes partout
    env:
      # LC_ALL=C : sous Linux, PyInstaller ne comprend la sortie de ldconfig qu'en anglais
      LC_ALL: C
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-lockfiles: |
            editor/web/package-lock.json
            desktop/package-lock.json
      - name: Versions (app-names.json, package.json et locks identiques)
        run: python scripts/verifier-version.py
      - name: Interface (build)
        working-directory: editor/web
        # racines du système plutôt que celles de Node, qui font encore confiance à
        # emSign ECC Root CA - G3 (incident eMudhra, octobre 2026)
        env:
          NODE_USE_SYSTEM_CA: "1"
        run: npm ci && npm run build
      - name: Serveur figé (PyInstaller)
        run: >
          pyinstaller --noconfirm --log-level WARN
          --distpath desktop/build --workpath desktop/build/.work desktop/server.spec
      - name: Dépendances de l'application de bureau
        working-directory: desktop
        # racines du système plutôt que celles de Node, qui font encore confiance à
        # emSign ECC Root CA - G3 (incident eMudhra, octobre 2026)
        env:
          NODE_USE_SYSTEM_CA: "1"
        run: npm ci
      - name: Test de fumée du serveur figé
        working-directory: desktop
        run: |
          server="$(node -p 'require("../app-names.json").id')-server"
          exe="build/$server/$server"
          [[ "$RUNNER_OS" == Windows ]] && exe="$exe.exe"
          [[ -f "$exe" ]] || { echo "serveur figé introuvable : $exe" >&2; exit 1; }
          KITMANAGER_SERVER="$exe" node --test --test-name-pattern "serveur figé" test/server.test.js
          expected="$server $(node -p 'require("../app-names.json").version')"
          [[ "$("$exe" --version)" == "$expected" ]] || { echo "--version : $("$exe" --version), attendu : $expected" >&2; exit 1; }
      - name: Paquet (electron-builder)
        if: ${{ !inputs.freeze-only }}
        working-directory: desktop
        run: npm run package
      - name: Paquets attendus, avec la version dans leur nom
        if: ${{ !inputs.freeze-only }}
        working-directory: desktop
        run: |
          id="$(node -p 'require("../app-names.json").id')"
          v="$(node -p 'require("../app-names.json").version')"
          case "$RUNNER_OS" in
            Linux) files=("${id}_${v}_amd64.deb") ;;
            Windows) files=("$id-$v-win-x64-setup.exe" "$id-$v-win-x64.zip") ;;
            macOS) files=("$id-$v-mac-arm64.dmg" "$id-$v-mac-arm64.zip") ;;
          esac
          mkdir -p paquets
          for f in "${files[@]}"; do
            [[ -f "dist/$f" ]] || { echo "paquet absent : dist/$f" >&2; ls dist >&2; exit 1; }
            cp "dist/$f" paquets/ && echo "✔ $f"
          done
          if [[ "$RUNNER_OS" == Linux ]]; then
            deb_version="$(dpkg-deb -f "dist/${files[0]}" Version)"
            [[ "$deb_version" == "$v" ]] || { echo "version du .deb : $deb_version, attendu : $v" >&2; exit 1; }
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.freeze-only }}
        with:
          name: paquet-${{ runner.os }}
          path: desktop/paquets/*
          if-no-files-found: error
