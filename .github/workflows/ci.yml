# Intégration continue : analyse et tests Python, analyse, tests et build de
# l'interface, analyse et tests de l'application de bureau, test de bout en
# bout (Playwright, Linux seulement), serveur figé
# (workflow build.yml, sous Linux, sans paquet). Préparation commune :
# .github/actions/setup.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Analyse (ruff check)
        run: ruff check --output-format github .
      - name: Formatage (ruff format)
        run: ruff format --check .
      - name: Tests
        run: python -m unittest discover -v -s tests -t .
      - name: Versions (app-names.json, package.json et locks identiques)
        run: python scripts/verifier-version.py

  web:
    name: Interface (ESLint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python: "false"
          node-lockfiles: editor/web/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Analyse (ESLint)
        run: npm run lint
      - name: Tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  desktop:
    name: Application de bureau (ESLint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python: "false"
          node-lockfiles: desktop/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Analyse (ESLint)
        run: npm run lint
      - name: Tests (node:test ; le test du serveur réel est ignoré, sans .venv)
        run: npm test

  e2e:
    name: Application de bureau (bout en bout)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: ./.github/actions/setup
        with:
          python: "false"
          node-lockfiles: |
            editor/web/package-lock.json
            desktop/package-lock.json
      # Ubuntu 24.04 : la sandbox de Chromium a besoin du profil AppArmor (voir
      # docs/application-bureau.md)
      - name: Profil AppArmor de l'Electron de développement
        run: |
          npm ci --prefix desktop --no-audit --no-fund
          profile="/etc/apparmor.d/$(jq -r .id app-names.json)-dev"
          desktop/apparmor.sh | sudo tee "$profile" >/dev/null
          sudo apparmor_parser -r "$profile"
      - name: Test de bout en bout (venv, interface, Playwright sous xvfb)
        run: xvfb-run -a ./dev.sh e2e

  frozen:
    name: Serveur figé
    uses: ./.github/workflows/build.yml
    with:
      os: '["ubuntu-24.04"]' # comme le paquet (voir build.yml)
      freeze-only: true
