# Intégration continue : analyse et tests Python, analyse et build de l'interface.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dépendances
        run: pip install -r requirements-dev.txt
      - name: Analyse (ruff check)
        run: ruff check --output-format github .
      - name: Formatage (ruff format)
        run: ruff format --check .
      - name: Tests
        run: python -m unittest discover -v -s tests -t .

  web:
    name: Interface (ESLint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editor/web/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Analyse (ESLint)
        run: npm run lint
      - name: Tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
